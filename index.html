:root{font-family:system-ui,sans-serif;color:#fff;background:#090d25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 5%,#2a145e,#090d25 65%);min-height:100vh}.shell{max-width:800px;margin:auto;padding:24px 16px 100px}h1{text-align:center;font-size:clamp(35px,9vw,65px);margin:16px 0 0;color:#fff;text-shadow:0 0 22px #12dafa}h1 span{color:#ffd05a}h2{margin:8px 0 20px}p,small{color:#c9d7ff;line-height:1.5}.panel{background:#111d46e8;border:1px solid #36c9f9;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 0 22px #0ab7fa22}label{display:block;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;padding:13px;background:#0a1330;border:1px solid #7289b8;border-radius:11px;color:#fff;font:inherit}input[type=file]{padding:9px}button{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(#ff50c5,#bf087a);color:white;font-weight:800;font-size:16px;cursor:pointer;margin:6px 6px 6px 0}button.blue{background:linear-gradient(#36b5ff,#174ac0)}button.green{background:linear-gradient(#13c7a1,#087d72)}button.orange{background:linear-gradient(#ffbd39,#e06d0a)}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid #526b9c;background:#101632;border-radius:12px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#253f78;padding:4px 9px;border-radius:30px}.hidden{display:none}#notice{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f28;border-radius:10px;padding:12px;margin:12px 0;color:#98f8dc}a{color:#8af4ff}.top{text-align:center}.muted{opacity:.7}code{overflow-wrap:anywhere}.star-rating{display:flex;align-items:center;gap:3px;flex-wrap:wrap}.star-rating .star{flex:0 0 auto;background:none;border:0;box-shadow:none;margin:0;padding:3px 5px;color:#65718e;font-size:34px;line-height:1;transition:color .15s,transform .15s}.star-rating .star.selected{color:#ffd05a;text-shadow:0 0 8px #e8a11e77}.star-rating .star:hover{transform:scale(1.12)}.star-rating .star:focus-visible{outline:2px solid #36c9f9}.star-value{margin-left:10px;color:#c9d7ff;font-weight:700}.star-criterion{margin:12px 0}

body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#222265 0%,transparent 55%),#05071d;color:#fff}
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(180deg,rgba(5,7,29,.18),rgba(4,7,30,.78) 54%,#05071d),var(--bgimage);background-position:center top;background-size:cover}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 5% 10%,#f9237140,transparent 24%),radial-gradient(ellipse at 90% 14%,#169cff55,transparent 27%)}
.shell{max-width:1100px;padding:24px 16px 80px}
.top{padding:16px 12px 20px;filter:drop-shadow(0 0 13px #0d79ff99)}
h1{font-size:clamp(35px,8vw,64px);font-weight:1000;letter-spacing:-1.5px;font-style:italic;line-height:1.05;transform:skew(-5deg);text-shadow:3px 4px #1c37d7,0 0 12px #13b8ff,0 0 24px #ea12ff}
h1 span{color:#ffe144;text-shadow:1px 2px #63104e,0 0 10px #ff159a}
h2{font-size:clamp(22px,4vw,30px);font-weight:950;text-transform:uppercase;text-shadow:0 0 12px #ff209c}
p,small{color:#e2eaff}
.panel{background:linear-gradient(180deg,#07143fea,#060b28ef);border:1px solid #377bff;border-radius:20px;box-shadow:0 0 0 2px #050b27,0 0 23px #1961ff65,inset 0 1px #6aa8ff50;padding:22px;margin:18px 0}
.panel>h2:first-child{background:linear-gradient(90deg,#e90087,#7510d7);padding:13px 15px;margin:-22px -22px 20px;border-radius:18px 18px 7px 7px;text-align:center;box-shadow:0 0 16px #fa189a66}
label{font-size:14px;font-weight:800}
input,select,textarea{border:1px solid #368bff;background:#081638;color:#fff;border-radius:10px;padding:13px;outline:none;box-shadow:inset 0 0 8px #116bff30}
input:focus,select:focus,textarea:focus{border-color:#fa39b7;box-shadow:0 0 12px #ff159a66}
button{border:1px solid #ff9ee4;border-radius:13px;padding:13px 18px;background:linear-gradient(180deg,#ff5cc5,#f00086 75%,#aa006c);box-shadow:inset 0 2px 2px #ffffff80,0 0 20px #ff159a66;color:#fff;font-weight:950;text-transform:uppercase;text-shadow:0 1px 2px #00143d;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.98)}
button.blue{background:linear-gradient(180deg,#208fff,#0751d2 70%,#0a2789);border-color:#75baff;box-shadow:inset 0 1px 1px #ffffff88,0 0 15px #157cff70}
button.green{background:linear-gradient(180deg,#1eeec5,#00a76b 70%,#006c5d);border-color:#65ffcd;box-shadow:inset 0 2px 2px #ffffff77,0 0 17px #00dfaf66}
button.orange{background:linear-gradient(180deg,#ffbf39,#e77800 70%,#9a4300);border-color:#ffe68b;box-shadow:inset 0 2px 2px #ffffff99,0 0 18px #ffad1677}
.item{border:1px solid #286af9;background:linear-gradient(135deg,#112867,#091237);box-shadow:0 0 13px #1254eb50;border-radius:14px;padding:15px;margin:12px 0}
.item:nth-child(4n+2){border-color:#fc42ca;background:linear-gradient(135deg,#571261,#130b38)}
.item:nth-child(4n+3){border-color:#ffae32;background:linear-gradient(135deg,#59301b,#17102d)}
.item:nth-child(4n+4){border-color:#14e6b4;background:linear-gradient(135deg,#075e58,#091d39)}
.pill{background:#184987;font-weight:900}

.app:before{background-image:linear-gradient(180deg,rgba(3,4,22,.06) 0%,rgba(3,5,24,.20) 45%,rgba(2,3,19,.40) 100%),var(--bgimage);background-position:center center;background-size:cover}
.app:after{background:radial-gradient(ellipse at 13% 5%,#f8229a35,transparent 35%),radial-gradient(ellipse at 87% 8%,#0a7dff42,transparent 35%),linear-gradient(90deg,#04041d55,transparent 12%,transparent 88%,#04041d55)}
.wrap{max-width:1050px}
.brand{width:min(84vw,380px);height:clamp(165px,28vh,255px);margin:4px auto 18px;display:block;filter:drop-shadow(0 0 15px #187dff99)}
.brand .camera,.brand .logo,.brand .logo-sub{display:none}
.brand:before{content:"";display:block;width:100%;height:100%;background-image:var(--reference-logo);background-position:center;background-repeat:no-repeat;background-size:contain}
.hero{max-width:460px;margin:0 auto;padding-top:1vh}
.hero h1{font-size:clamp(24px,6.6vw,31px);text-transform:none;text-shadow:0 2px 10px #000,0 0 10px #c31efb;margin:4px 0 9px}
.hero p{max-width:365px;font-size:clamp(15px,3.8vw,19px);line-height:1.5;margin:0 auto 25px;text-shadow:0 2px 7px #000}
.stack{max-width:430px;gap:17px}
.hero .btn{min-height:103px;font-size:clamp(20px,5.7vw,27px);line-height:1.15;letter-spacing:.2px;border-width:2px;border-radius:18px;box-shadow:inset 0 3px 3px #ffffff80,0 0 22px #ff22ad75,0 8px 0 #03092399}
.hero .btn.blue{box-shadow:inset 0 3px 3px #ffffff88,0 0 23px #00aaff88,0 8px 0 #03092399}
.hero .btn.purple{background:linear-gradient(180deg,#ffb72d,#db7a00 70%,#97500a);border-color:#ffe67e;box-shadow:inset 0 3px 3px #ffffff88,0 0 23px #ffae2588,0 8px 0 #03092399}
.panel{border-width:2px;background:linear-gradient(180deg,#07133feF,#020b2bf2);box-shadow:0 0 0 2px #07102c,0 0 26px #156dff78,inset 0 1px #7fa8ff7c}
.panel.narrow{max-width:460px}
.heading{background:linear-gradient(180deg,#b20879,#720e75);font-size:clamp(21px,5.4vw,29px);padding:20px 12px}
.field label{font-size:18px}
.field input{padding:17px;font-size:18px;border-width:2px}
.panel .btn:not(.sm){min-height:75px;font-size:clamp(16px,4.5vw,21px);border-width:2px}
.panel p{line-height:1.5}
.check{font-size:88px;color:#39ffb6;text-shadow:0 0 12px #06d78e,0 0 35px #0bffb8}
.code{padding:10px;background:#07112c;border:2px solid #068fff;border-radius:13px;margin:12px auto;max-width:300px}
.game-card{border-width:2px}
.game-name{font-size:19px}
.tile{border-width:2px;min-height:135px}
@media(max-width:520px){
  .wrap{padding:12px 16px 34px}
  .hero{padding-top:2vh}
  .hero .brand{height:clamp(190px,29vh,260px);margin-bottom:8px}
  .hero .btn{min-height:clamp(82px,12vh,110px)}
  .hero .stack{gap:15px}
  .panel{padding:18px 16px}
  .heading{margin:-18px -16px 20px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-height:690px){.hero .brand{height:150px}.hero .btn{min-height:68px}.hero p{margin-bottom:13px}.hero .stack{gap:10px}}


/* PHASE 2 — équipes et défis */
.setup-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.setup-head h2{margin:0}.setup-count{background:#15255c;border:1px solid #5687ff;border-radius:30px;padding:8px 13px;font-weight:800}.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.setup-card{position:relative;padding:18px;border-radius:17px;border:2px solid var(--card-color,#3895ff);background:linear-gradient(150deg,color-mix(in srgb,var(--card-color,#3895ff) 28%,#091037),#090d31 76%);box-shadow:0 0 17px color-mix(in srgb,var(--card-color,#3895ff) 37%,transparent);min-height:155px;overflow:hidden}.setup-card h3{font-size:21px;margin:4px 0 8px;overflow-wrap:anywhere}.setup-card .card-icon{font-size:30px}.setup-card .card-details{font-size:13px;color:#dce8ff;line-height:1.5}.setup-card .card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.setup-card .card-actions button{flex:1;border:1px solid #8ba7ff;border-radius:9px;padding:10px 7px;background:#10245d;color:#fff;font-weight:800;cursor:pointer}.setup-card .card-actions button.danger{background:#661c43;border-color:#ff6ba8}.setup-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.setup-toolbar select,.setup-toolbar input{background:#081638;color:#fff;border:2px solid #4779e7;border-radius:12px;padding:12px;font-size:16px;min-width:0;flex:1}.setup-next{margin-top:22px;display:grid;gap:12px}.setup-next .btn{width:100%}.setup-card .points{font-weight:900;color:#ffe06b;font-size:20px;margin:5px 0}.setup-card .pill{display:inline-block;margin:5px 4px 4px 0}.setup-form{display:grid;gap:14px}.setup-form textarea,.setup-form select,.setup-form input[type=file]{display:block;width:100%;background:#071535;border:2px solid #497cfa;color:#fff;border-radius:12px;padding:13px;font:inherit;box-sizing:border-box}.setup-form textarea{min-height:105px;resize:vertical}.setup-form .field{margin:0}.setup-form .field label{display:block;margin-bottom:8px}.color-choices{display:flex;gap:10px;flex-wrap:wrap}.color-choices label{cursor:pointer}.color-choices input{position:absolute;opacity:0}.color-choices span{display:block;width:37px;height:37px;background:var(--swatch);border:3px solid #ffffff66;border-radius:12px}.color-choices input:checked+span{outline:3px solid white;outline-offset:3px}.setup-hint{font-size:13px;color:#bfd0fc;line-height:1.5}.preview-photo{width:100%;max-height:155px;object-fit:cover;border-radius:10px;margin-top:9px}.setup-import{border:1px dashed #61b3ff;padding:15px;border-radius:14px;background:#061639a6}.setup-actions{display:flex;gap:9px;flex-wrap:wrap}.setup-actions button{flex:1;min-width:125px}.status-chip{background:#073b4a;color:#b2fff0;border:1px solid #17d5c7;border-radius:12px;padding:10px 12px;font-size:13px}.setup-notice{background:#071b47;border-left:4px solid #3ab8ff;padding:12px 14px;border-radius:8px;line-height:1.5;margin-bottom:16px}
@media(max-width:520px){.setup-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.setup-card{padding:12px;min-height:160px}.setup-card h3{font-size:16px}.setup-card .card-actions button{font-size:12px;padding:8px 5px}.setup-head h2{font-size:19px}.setup-toolbar select{width:100%}.setup-toolbar{flex-direction:column;align-items:stretch}}

/* PHOTO RUSH — mêmes effets TV SHOW que les maquettes approuvées */
.team-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.team-pick-card{min-height:94px;border:2px solid var(--tc);border-radius:18px;background:linear-gradient(145deg,#0d1d4a,#07102c);color:white;font-size:18px;font-weight:900;box-shadow:0 0 20px color-mix(in srgb,var(--tc),transparent 65%);cursor:pointer}.rush-team{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:15px;border:2px solid var(--tc);background:#0b1540;font-size:20px;font-weight:900;margin:15px 0;box-shadow:0 0 16px color-mix(in srgb,var(--tc),transparent 70%)}.rush-team span{color:#ffe16d}.rush-challenge{transition:box-shadow .2s}.rush-accepted{background:linear-gradient(155deg,#073b36,#061c29)}.rush-pending{background:linear-gradient(155deg,#3b2b0a,#09152d)}.rush-rejected{background:linear-gradient(155deg,#391229,#0a1028)}.status-box{border:2px solid #ffaa30;padding:17px;border-radius:15px;margin:20px 0;text-align:center;background:#0a1432}.status-accepted{border-color:#15e7a7}.status-rejected{border-color:#ff456f}.media-stage{background:#020819;border:2px solid #1c82ff;border-radius:16px;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:20px 0;color:#d9e8ff}.media-stage img,.media-stage video{display:block;width:100%;max-height:58vh;object-fit:contain}.setup-grid .rush-challenge .card-actions button{font-size:14px}.panel .status-box .btn{margin-top:10px}@media(max-width:520px){.team-pick{grid-template-columns:1fr 1fr}.rush-team{font-size:16px}.media-stage{min-height:150px}}

/* PHOTO AWARDS — TV SHOW néon */
.award-register{margin-top:24px;padding:18px;border:2px solid #33a4ff;border-radius:19px;background:linear-gradient(150deg,#14124b,#080d2d);box-shadow:0 0 18px #176dff55}
.award-register h2{font-size:20px;color:#f9d6ff}
.award-criterion{padding:15px 0;border-bottom:1px solid #47588c;margin:10px 0}
.award-criterion>label{font-weight:900;font-size:19px;display:block;margin-bottom:12px}
.star-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.star-choice{position:relative;cursor:pointer}
.star-choice input{position:absolute;opacity:0;width:1px;height:1px}
.star-choice span{display:block;text-align:center;border:2px solid #5b74b3;background:#0b1742;padding:12px 2px;border-radius:12px;color:#e9efff;font-size:clamp(12px,3.1vw,16px);font-weight:900}
.star-choice input:checked+span{background:linear-gradient(180deg,#f9bb36,#d97806);border-color:#fff3a1;color:#1e1332;box-shadow:0 0 15px #ffc338aa}
.star-choice input:focus-visible+span{outline:3px solid #fff}
.award-ranking{display:grid;gap:12px;margin:20px 0}
.rank-card{display:flex;gap:12px;align-items:center;padding:15px;border:2px solid var(--tc);border-radius:17px;background:linear-gradient(135deg,#14204b,#090d2c);box-shadow:0 0 14px color-mix(in srgb,var(--tc),transparent 65%)}
.rank-pos{font-size:27px;min-width:45px;text-align:center;font-weight:900}
.rank-data{flex:1;min-width:0;font-size:13px;line-height:1.7}
.rank-data h3{margin:0 0 5px;font-size:19px}
.rank-card>strong{font-size:19px;color:#ffe27b;white-space:nowrap}
.score-bar{height:9px;background:#101a37;border-radius:30px;overflow:hidden;margin-top:7px}
.score-bar span{height:100%;display:block;background:linear-gradient(90deg,#09d7ff,#fd27a7,#ffdf49)}
.score-help{padding:14px;background:#0b1640;border:1px solid #4978e8;border-radius:12px;font-size:13px;line-height:1.5}
@media(max-width:520px){.rank-card{padding:10px;gap:8px}.rank-pos{min-width:30px;font-size:22px}.rank-data h3{font-size:16px}.rank-card>strong{font-size:15px}}

/* Phase 5 — écran public panoramique TV SHOW */
.public-shell{position:relative;min-height:min(95vh,950px);width:min(96vw,1550px);margin:0 auto;display:flex;flex-direction:column;border:3px solid #258dff;border-radius:22px;overflow:hidden;color:white;background:radial-gradient(ellipse at 50% 20%,#233a94,#080c2b 55%,#03051b);box-shadow:0 0 38px #147aff77,inset 0 0 65px #171d7b}
.public-shell:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 10%,#ff21ab19 25%,transparent 35%,#0be3ff19 65%,transparent 78%);z-index:0}
.public-shell>*{position:relative;z-index:1}
.public-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;background:linear-gradient(90deg,#181048,#370e67,#08134d);border-bottom:3px solid #ed2ca8}
.public-brand{font-size:clamp(20px,3vw,37px);font-weight:1000;color:#fff;text-shadow:0 0 15px #fc2bb5}
.public-brand span{color:#ffdc51}
.public-phase{padding:10px 20px;border-radius:30px;background:#a20c86;box-shadow:0 0 15px #ff2bb0;font-size:clamp(13px,2vw,24px);font-weight:900}
.public-code{font-size:clamp(11px,1.4vw,17px);max-width:30%;text-align:right}
.public-stage{padding:clamp(14px,2.4vw,30px);flex:1}
.public-topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.public-glow-label{font-size:clamp(20px,3.3vw,42px);font-weight:1000;text-shadow:0 0 20px #ed3bdf}
.public-clock{font-size:clamp(25px,4.4vw,60px);font-weight:1000;color:#ffe476;text-shadow:0 0 20px #ffa726}
.public-columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:24px}
.public-main,.public-aside{padding:20px;border-radius:20px;border:2px solid #426ed4;background:linear-gradient(160deg,#0e1645ee,#080c2af0);box-shadow:0 0 24px #086bfa4d}
.public-main h2,.public-aside h2{font-size:clamp(17px,2vw,28px);text-align:center;color:#fff0a2;margin:0 0 17px}
.public-media{height:clamp(250px,40vw,520px);max-height:57vh;display:flex;justify-content:center;align-items:center;background:#020519;border:2px solid #a33fdd;border-radius:18px;overflow:hidden}
.public-media img,.public-media video{width:100%;height:100%;object-fit:contain}
.public-media-caption{text-align:center;font-weight:800;margin-top:12px;color:#b6e8ff}
.public-team{margin:19px 0}
.public-team-head{display:flex;justify-content:space-between;gap:12px;font-weight:900;margin-bottom:8px}
.public-team-head strong{white-space:nowrap}
.public-progress{height:15px;background:#0c1336;border-radius:25px;border:1px solid #47609c;overflow:hidden}
.public-progress span{display:block;height:100%;background:linear-gradient(90deg,#12d6ff,#ff26b4);box-shadow:0 0 15px #f525af}
.public-footnote{text-align:center;color:#a9b9e9;margin-top:25px}
.public-total{text-align:center;padding:50px 0 22px;display:grid;gap:10px}
.public-total strong{font-size:clamp(65px,8vw,140px);color:#ffdd59;text-shadow:0 0 35px #ffbf16}
.public-wait{font-size:clamp(18px,3vw,35px);text-align:center;color:#d8eaff;padding:25px}
.public-footer{display:flex;justify-content:space-between;gap:15px;padding:13px 25px;border-top:2px solid #973ee9;color:#bdc8ff;font-weight:800;font-size:clamp(11px,1.4vw,17px)}
.public-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px auto 30px}
.public-controls .btn{width:auto;min-height:52px;padding:12px 18px}
.public-final{text-align:center;min-height:450px;padding:15px}
.public-final h1{font-size:clamp(30px,4.5vw,64px);color:#ffdc61;text-shadow:0 0 20px #ffb728,0 0 38px #e224b0}
.public-podium{max-width:900px;margin:30px auto;display:grid;gap:14px}
.public-winner{display:flex;align-items:center;gap:20px;padding:16px 24px;text-align:left;border:3px solid var(--team);border-radius:20px;background:#151342;box-shadow:0 0 25px color-mix(in srgb,var(--team),transparent 55%)}
.public-medal{font-size:clamp(27px,4vw,50px);min-width:60px}
.public-winner>div:nth-child(2){flex:1;display:grid;gap:5px}
.public-winner strong{font-size:clamp(21px,3vw,36px)}
.public-winner small{color:#c1d5ff}
.public-winner b{font-size:clamp(18px,2.4vw,30px);color:#ffe47b}
.public-shell:fullscreen{width:100vw;height:100vh;min-height:100vh;border-radius:0}
@media(max-width:780px){.public-columns{grid-template-columns:1fr}.public-header{padding:13px;flex-wrap:wrap}.public-code{max-width:none}.public-media{height:38vh}.public-shell{width:100%}.public-controls .btn{font-size:13px}}

/* Adaptation of online game to the original TV SHOW layout */
.shell{max-width:1100px;margin:auto;padding:20px 16px 80px;position:relative;z-index:1}
body{background:#05071d;color:white}
body:before{z-index:-2}
body:after{z-index:-1}
.top{display:block;text-align:center;min-height:unset;padding:8px 0 18px}
.brand{margin:10px auto 18px;display:flex;flex-direction:column;align-items:center}
.camera{font-size:58px}
.logo{font-size:clamp(33px,8vw,63px)}
.logo-sub{font-size:clamp(17px,4vw,29px)}
.panel{max-width:100%;margin:16px auto;background:linear-gradient(180deg,#07143fea,#060b28ef);border:1px solid #377bff;border-radius:20px;padding:20px;box-shadow:0 0 0 2px #050b27,0 0 23px #1961ff65,inset 0 1px #6aa8ff50}

button.blue,button.green,button.orange{color:white}
.item{padding:15px;margin:12px 0;border:1px solid #286af9;border-radius:14px;background:linear-gradient(135deg,#112867,#091237)}

.star-rating .star.selected{color:#ffe144;text-shadow:0 0 12px #ffc83e,0 0 20px #ff159a77}
.star-criterion{padding:12px 14px;border:1px solid #347aff66;border-radius:12px;background:#07163dcc}
.star-value{color:#ffe144}

@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.shell{padding:12px 10px 65px}.panel{padding:15px}.panel>h2:first-child{margin:-15px -15px 18px}}

.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}.podium-place{border:1px solid #ffcf4b;border-radius:15px;background:linear-gradient(150deg,#3c1b69,#091a4c);padding:20px 10px;text-align:center;box-shadow:0 0 17px #ffcf4b44}.vote-details{border:1px solid #346bff;border-radius:12px;padding:12px;margin:12px 0;background:#081638}.vote-details summary,details>summary{cursor:pointer;font-weight:800;padding:9px;color:#ffe16c}details{margin:12px 0}details[open]{border:1px solid #3b72ef;border-radius:12px;padding:8px} .phase-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;margin-top:12px}.phase-buttons button{width:100%;min-width:0;min-height:54px;height:100%;white-space:normal;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 6px;font-size:clamp(11px,2.4vw,15px)}@media(max-width:480px){.phase-buttons{gap:5px}.phase-buttons button{padding:8px 3px;font-size:11px}}

/* Cartes de confirmation TV SHOW : toute commande cliquable */
#pc-confirm-layer{position:fixed;inset:0;z-index:999999;background:rgba(2,5,24,.82);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}
#pc-confirm-card{width:min(440px,100%);box-sizing:border-box;padding:28px 22px;border:2px solid #b15aff;border-radius:23px;background:linear-gradient(145deg,#18133f,#080e31);box-shadow:0 0 42px #7432e077,0 0 15px #2c83ff55;text-align:center;color:white}

#pc-confirm-cancel{background:#343c63;color:white}#pc-confirm-ok{background:linear-gradient(#309dff,#0739b4);color:white}
.pc-challenge-item .pc-challenge-title{display:block;font-size:1.08em;font-weight:900;overflow-wrap:anywhere;line-height:1.5}.pc-challenge-item .pc-challenge-points{display:block;margin-top:7px;margin-bottom:8px;color:#ffe06b;font-weight:900;font-size:1.15em}

.pc-game-code{color:#c1d5ff;font-size:.9em;margin-top:5px}.pc-saved-actions{display:flex;gap:8px;flex-wrap:wrap}.pc-saved-actions button{min-width:110px}

/* Carte finale: proportions et éléments de la maquette validée */

/* Uniformisation SC Dubai pour toutes les interfaces arabes */
:root{--arabic-font:"SC Dubai",system-ui,sans-serif}
html,body,button,input,textarea,select,option,[lang="ar"],[dir="rtl"],[lang="ar"] *,[dir="rtl"] *{font-family:var(--arabic-font)!important}
button::placeholder,input::placeholder,textarea::placeholder{font-family:var(--arabic-font)!important}

/* Actions des parties sauvegardées : boutons côte à côte sur mobile */
.pc-saved-game .pc-saved-actions{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:10px!important;width:100%!important;flex-wrap:nowrap!important}
.pc-saved-game .pc-saved-actions button{width:100%!important;min-width:0!important;max-width:none!important;margin:0!important;padding:12px 6px!important;min-height:54px!important;font-size:clamp(12px,3.3vw,17px)!important;white-space:nowrap!important}

/* Connexion : deux actions alignées et adaptées aux écrans mobiles */
#auth .pc-auth-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:12px}
#auth .pc-auth-actions button{box-sizing:border-box;width:100%!important;min-width:0!important;margin:0!important;padding:12px 5px!important;min-height:58px;font-size:clamp(12px,3.5vw,18px)!important;line-height:1.2;white-space:normal;overflow-wrap:normal;text-align:center}
@media(max-width:360px){#auth .pc-auth-actions{gap:6px}#auth .pc-auth-actions button{font-size:12px!important;padding:10px 3px!important}}

/* Correctif prioritaire : rangée connexion toujours horizontale */
#root form#auth > .pc-auth-actions{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;gap:8px!important;width:100%!important;max-width:100%!important}
#root form#auth > .pc-auth-actions > button{display:flex!important;flex:1 1 0!important;width:0!important;min-width:0!important;max-width:none!important;align-items:center!important;justify-content:center!important;white-space:normal!important;overflow-wrap:anywhere!important;text-align:center!important;margin:0!important;padding:10px 4px!important;font-size:clamp(11px,3.2vw,16px)!important;line-height:1.15!important}

/* Accueil mobile : proportions fidèles à la maquette validée */
#root form#auth>.pc-auth-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;margin:12px 0 0!important;width:100%!important;align-items:stretch!important}
#root form#auth>.pc-auth-actions>button{display:flex!important;width:100%!important;min-width:0!important;max-width:100%!important;min-height:56px!important;height:56px!important;padding:8px 4px!important;margin:0!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-size:clamp(11px,3.1vw,15px)!important;line-height:1.15!important;font-weight:800!important;white-space:normal!important;overflow-wrap:normal!important;border-radius:12px!important}
#root .pc-guest-button{display:block!important;width:100%!important;min-height:60px!important;height:auto!important;margin:12px 0 18px!important;padding:14px 8px!important;font-size:clamp(13px,3.7vw,18px)!important;border-radius:12px!important;line-height:1.25!important}

/* Même largeur exacte pour l'action invité et la rangée connexion */
#root .panel.narrow .pc-guest-button{box-sizing:border-box!important;display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;margin-left:0!important;margin-right:0!important}
#root .panel.narrow form#auth,#root .panel.narrow form#auth>.pc-auth-actions{box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important;margin-left:0!important;margin-right:0!important}

/* Grand écran PHOTO AWARDS : galerie et indicateurs de votes */
.pc-live-gallery{max-width:1100px;margin:18px auto;border:2px solid #b94bfa;border-radius:24px;padding:16px;background:linear-gradient(120deg,#1c124b,#07183f)}
.pc-live-gallery>h3{text-align:center;margin:4px 0 16px;font-size:clamp(19px,3vw,30px)}
.pc-gallery-stage{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:10px}
.pc-gallery-arrow{width:50px!important;height:55px!important;min-width:0!important;margin:0!important;padding:0!important;font-size:27px!important}

function ceremony(){
 const owner=game.owner===session.user.id;
 const accepted=submissions.filter(s=>s.status==='accepted');
 const raw=teams.map(t=>{
  const own=accepted.filter(s=>s.team_id===t.id);
  const rush=own.reduce((a,s)=>a+Number(challenges.find(c=>c.id===s.challenge_id)?.points||0),0);
  const ids=new Set(own.map(s=>s.id));
  const vs=votes.filter(v=>ids.has(v.submission_id));
  const awards=vs.length?vs.reduce((a,v)=>a+(v.creativity+v.humor+v.respect)/3,0)/vs.length:0;
  return {name:t.name,rush,awards,count:vs.length};
 });
 const maxRush=Math.max(1,...raw.map(x=>x.rush));
 const ranked=raw.map(x=>({...x,score:60*x.rush/maxRush+40*x.awards/5})).sort((a,b)=>b.score-a.score);
 const step=Math.max(0,Math.min(Number(game.ceremony_step)||0,ranked.length+1));
 const revealed=Math.min(Math.max(step-1,0),ranked.length);
 const allDone=ranked.length>0&&revealed>=ranked.length;
 const entries=ranked.slice().reverse().slice(0,revealed);
 const control=owner?`<div class="ceremony-controls"><button class="blue" data-act="ceremony-back">← Régie organisateur</button>${!allDone?`<button class="green" data-act="ceremony-next">${step===0?'🎬 Autoriser et commencer la cérémonie':step===1?'🏆 Révéler la dernière place':'✨ Révéler l’équipe suivante'}</button>`:''}${allDone?'<span class="pill">Cérémonie terminée</span>':''}</div>`:'';
 const status=step===0?'🔒 La cérémonie attend l’autorisation de l’organisateur.':step===1?'🎬 La cérémonie commence ! Préparez-vous pour le classement…':allDone?'🏆 Voici le classement final !':`✨ ${revealed} équipe${revealed>1?'s':''} révélée${revealed>1?'s':''} sur ${ranked.length}.`;
 return `<section class="ceremony-screen"><div class="ceremony-stage"><div class="ceremony-glow">📸 PHOTO CHALLENGE</div><h1>🏆 CÉRÉMONIE FINALE</h1><p class="ceremony-status">${status}</p>${step===0?'<div class="ceremony-lock">🔐 Classement secret</div>':''}${step===1?'<div class="ceremony-countdown">✨ QUE LE SPECTACLE COMMENCE ! ✨</div>':''}${entries.length?`<div class="ceremony-reveals">${entries.map((t,i)=>{const place=ranked.length-i;const medal=place===1?'🥇':place===2?'🥈':place===3?'🥉':'⭐';return `<div class="ceremony-entry ${place===1?'champion':''}"><div class="ceremony-rank">${medal} ${place}${place===1?'er':'e'}</div><div class="ceremony-team">${esc(t.name)}</div><div class="ceremony-score">${t.score.toFixed(1)} / 100</div></div>`}).join('')}</div>`:''}${allDone?`<h2>🎉 BRAVO À TOUTES LES ÉQUIPES !</h2><details><summary>Voir les scores détaillés</summary>${ranked.map((t,i)=>`<div class="item">${i+1}. <b>${esc(t.name)}</b> — ${t.score.toFixed(1)}/100 · PHOTO RUSH : ${t.rush} pts · PHOTO AWARDS : ${t.awards.toFixed(2)}/5 (${t.count} votes)</div>`).join('')}</details>`:''}${control}${!owner?'<p class="muted">Les résultats apparaissent automatiquement lorsque l’organisateur les autorise.</p>':''}</div></section>`;
}

window.pcHandleFormSubmit=async e=>{e.preventDefault();const f=e.target;if(!(f instanceof HTMLFormElement))return;const d=new FormData(f);const editing=f.id==='editchallenge';let editButton=null;if(editing){editButton=f.querySelector('button[type=submit]');if(editButton?.disabled)return;if(editButton){editButton.disabled=true;editButton.dataset.oldLabel=editButton.textContent;editButton.textContent='Enregistrement en cours…'}let box=f.querySelector('#pc-edit-feedback');if(!box){box=document.createElement('div');box.id='pc-edit-feedback';box.setAttribute('role','alert');box.setAttribute('aria-live','assertive');f.prepend(box)}box.textContent='Vérification du défi et de l’image…';box.style.color='#8dfbe1'}try{if(f.id==='auth'){await query(sb.auth.signInWithPassword({email:d.get('email'),password:d.get('password')}));return}if(f.id==='newgame'){let g;for(let i=0;i<4;i++){try{g=await query(sb.from('pc_games').insert({name:d.get('name'),code:randomCode(),owner:session.user.id}).select().single());break}catch(x){if(x.code!=='23505')throw x}}if(!g)throw Error('Impossible de générer le code');await importDefaultChallenges40(g.id);await openGame(g.id);return}if(f.id==='findgame'){const code=String(d.get('code')).toUpperCase().trim();const list=await query(sb.rpc('pc_teams_for_code',{join_code:code}));$('joinTeams').innerHTML=list.length?`<p>Choisissez votre équipe :</p>${list.map(t=>`<button class="blue" data-join="${t.id}" data-code="${esc(code)}">${esc(t.name)}</button>`).join('')}`:'Aucune équipe trouvée.';return}if(f.id==='newteam'){await query(sb.from('pc_teams').insert({game_id:game.id,name:d.get('name')}));await refresh();return}if(f.id==='editchallenge'){if(game.owner!==session.user.id)throw Error('Réservé à l’organisateur.');const id=String(d.get('id'));const title=String(d.get('title')||'').trim(),description=String(d.get('description')||'').trim(),points=Number(d.get('points'));if(!title||!description||![100,200,300].includes(points))throw Error('Titre, consigne et difficulté valides obligatoires.');const updated=await query(sb.from('pc_challenges').update({title,description,points}).eq('id',id).eq('game_id',game.id).select('id'));if(!updated?.length)throw Error('Modification non autorisée.');document.getElementById('challenge-editor')?.remove();await refresh();say('Défi modifié avec succès.');return}if(f.id==='newchallenge'){await query(sb.from('pc_challenges').insert({game_id:game.id,title:d.get('title'),description:d.get('description'),points:Number(d.get('points'))}));await refresh();return}if(f.classList.contains('upload')){if(!myTeam?.team_id)throw Error('Vous devez rejoindre une équipe.');const file=d.get('media');if(!file||!file.size||file.size>50*1024*1024)throw Error('Fichier vide ou trop volumineux (50 Mo max).');if(!['image/jpeg','image/png','image/webp','video/mp4','video/webm'].includes(file.type))throw Error('Format non pris en charge par le stockage : '+(file.type||'inconnu')+'. Pour les vidéos, utilisez MP4 ou WebM. Les vidéos MOV/QuickTime nécessitent une autorisation pour modifier la configuration Supabase.');const path=`${game.id}/${myTeam.team_id}/${session.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;say('Envoi du fichier en cours… Gardez cette page ouverte.');const {error:uploadError}=await sb.storage.from('photo-challenge-media').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});if(uploadError)throw new Error('Envoi vidéo/photo échoué : '+uploadError.message+'. Vérifiez le format MP4/WebM et la limite de 50 Mo.');try{await query(sb.from('pc_submissions').insert({game_id:game.id,challenge_id:f.dataset.challenge,team_id:myTeam.team_id,user_id:session.user.id,object_path:path,media_type:file.type}))}catch(x){await sb.storage.from('photo-challenge-media').remove([path]);throw x}say('Média envoyé pour validation.');await refresh();return}if(f.classList.contains('vote')){const selected=submissions.find(s=>s.id===f.dataset.id);if(!selected||selected.challenge_id!==game.active_awards_challenge)throw Error('Ce défi est fermé au vote.');await query(sb.from('pc_votes').insert({submission_id:f.dataset.id,user_id:session.user.id,creativity:Number(d.get('creativity')),humor:Number(d.get('humor')),respect:Number(d.get('respect'))}));say('Vote enregistré.');await refresh();return}}catch(x){err(x);if(editing){const box=f.querySelector('#pc-edit-feedback');if(box){box.textContent='❌ Échec de l’enregistrement : '+(x?.message||String(x));box.style.color='#ff9dbb';box.scrollIntoView({block:'center',behavior:'smooth'})}}}finally{if(editButton?.isConnected){editButton.disabled=false;editButton.textContent=editButton.dataset.oldLabel||'Enregistrer les modifications'}}};
document.addEventListener('submit',window.pcHandleFormSubmit);
$('root').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.act==='awards-display-back'){pcDisplayId=null;pcDisplaySignature='';document.body.classList.remove('pc-awards-mode');const u=new URL(location.href);u.searchParams.delete('awards-screen');history.replaceState({},'',u.href);render();return}if(b.dataset.act==='gallery-prev'||b.dataset.act==='gallery-next'){const count=submissions.filter(s=>s.status==='accepted'&&s.challenge_id===pcActiveChallenge()?.id).length;pcMediaIndex=Math.max(0,Math.min(count-1,pcMediaIndex+(b.dataset.act==='gallery-next'?1:-1)));pcDisplaySignature='';pcDisplayScreen();return}if(b.dataset.act==='awards-next'){if(!game||game.owner!==session.user.id||game.phase!=='awards')throw Error('Action réservée à l’organisateur pendant PHOTO AWARDS.');const q=pcAwardsQueue(),idx=q.findIndex(c=>c.id===game.active_awards_challenge),next=q[idx+1];if(!next)throw Error('Aucun autre défi à afficher.');await query(sb.from('pc_games').update({active_awards_challenge:next.id}).eq('id',game.id).eq('owner',session.user.id));await refresh();return}if(b.dataset.act==='awards-display'){pcOpenDisplay();return}if(b.dataset.star){const group=b.closest('.star-rating');const value=Number(b.dataset.star);const field=b.dataset.field;const form=b.closest('form.vote');if(!group||!form||!Number.isInteger(value)||value<1||value>5)return;form.elements.namedItem(field).value=String(value);group.querySelectorAll('button[data-star]').forEach(star=>{const active=Number(star.dataset.star)<=value;star.classList.toggle('selected',active);star.setAttribute('aria-pressed',String(Number(star.dataset.star)===value))});group.querySelector('.star-value').textContent=value+'/5';return}try{if(b.dataset.pcFilter){
 const group=b.closest('.pc-challenge-filters');
 if(!group)return;
 group.querySelectorAll('[data-pc-filter]').forEach(el=>el.classList.toggle('active',el===b));
 const v=b.dataset.pcFilter;
 document.querySelectorAll('.pc-challenge-grid>.pc-challenge-item').forEach(el=>{
  el.hidden=!(v==='all'||v===el.dataset.pcType||v===el.dataset.pcPoints);
 });
 return;
 }
 if(b.dataset.deleteGame){
 const id=b.dataset.deleteGame;
 const row=b.closest('.pc-saved-game');
 if(!row||!session?.user)return;
 const name=row.querySelector('b')?.textContent||'cette partie';
 document.getElementById('pc-delete-game-layer')?.remove();
 const layer=document.createElement('div');layer.id='pc-delete-game-layer';
 layer.innerHTML='<div id="pc-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pc-delete-game-title"><h2 id="pc-delete-game-title">🗑️ Supprimer la partie</h2><p>Voulez-vous supprimer définitivement la partie <strong id="pc-delete-game-name"></strong> ?</p><p>Les équipes, défis, votes et réalisations associés seront supprimés. Les fichiers médias seront nettoyés automatiquement.</p><p id="pc-delete-game-error" role="alert" aria-live="assertive" hidden></p><div class="pc-confirm-actions"><button type="button" id="pc-delete-game-cancel">Annuler</button><button type="button" id="pc-delete-game-yes" class="red">Supprimer définitivement</button></div></div>';
 layer.querySelector('#pc-delete-game-name').textContent=name;
 document.body.appendChild(layer);
 const close=()=>layer.remove();
 layer.querySelector('#pc-delete-game-cancel').addEventListener('click',close);
 layer.addEventListener('click',e=>{if(e.target===layer)close()});
 layer.querySelector('#pc-delete-game-yes').addEventListener('click',async()=>{
  const yes=layer.querySelector('#pc-delete-game-yes');yes.disabled=true;yes.textContent='Suppression…';
  try{
   const removed=await query(sb.from('pc_games').delete().eq('id',id).eq('owner',session.user.id).select('id'));
   if(!Array.isArray(removed)||removed.length!==1)throw Error('La partie n’a pas été supprimée. Vérifiez que vous êtes connecté avec le compte organisateur propriétaire.');
   close();if(game?.id===id){game=null;await stopWatch();render()}else await loadMyGames();
   say('Partie supprimée. Nettoyage des médias programmé.');
  }catch(ex){yes.disabled=false;yes.textContent='Supprimer définitivement';const msg=layer.querySelector('#pc-delete-game-error');msg.hidden=false;msg.textContent='Échec de la suppression : '+(ex?.message||String(ex));err(ex)}
 });
 return;
 }
 if(b.dataset.deleteChallenge){
 if(!game||game.owner!==session.user.id)throw Error('Suppression réservée à l’organisateur.');
 const c=challenges.find(x=>x.id===b.dataset.deleteChallenge);
 if(!c)throw Error('Défi introuvable.');
 const related=submissions.filter(s=>s.challenge_id===c.id);
 if(related.length){say('Suppression impossible : ce défi possède '+related.length+' réalisation(s). Vous pouvez toujours le modifier.');return}
 const old=document.getElementById('challenge-delete-card');if(old)old.remove();
 const card=document.createElement('div');card.id='challenge-delete-card';card.className='panel';
 card.innerHTML='<h3>⚠️ Confirmer la suppression</h3><p>Supprimer définitivement le défi <strong></strong> ?</p><div class="row"><button type="button" class="red" data-confirm-delete-challenge="'+c.id+'">Confirmer la suppression</button><button type="button" data-act="cancel-delete-challenge">Annuler</button></div>';
 card.querySelector('strong').textContent=c.title;
 b.closest('.item').insertAdjacentElement('afterend',card);
 card.scrollIntoView({block:'nearest',behavior:'smooth'});return;
 }
 if(b.dataset.act==='cancel-delete-challenge'){document.getElementById('challenge-delete-card')?.remove();return}
 if(b.dataset.confirmDeleteChallenge){
 if(!game||game.owner!==session.user.id)throw Error('Suppression réservée à l’organisateur.');
 const id=b.dataset.confirmDeleteChallenge;
 if(submissions.some(s=>s.challenge_id===id))throw Error('Ce défi a des réalisations et ne peut pas être supprimé.');
 if(game.active_awards_challenge===id)throw Error('Ce défi est en cours de vote. Passez à un autre défi avant de le supprimer.');
 await query(sb.from('pc_challenges').delete().eq('id',id).eq('game_id',game.id));
 await refresh();say('Défi supprimé.');return;
 }
 if(b.dataset.editChallenge){if(game.owner!==session.user.id)throw Error('Réservé à l’organisateur.');const c=challenges.find(x=>x.id===b.dataset.editChallenge);if(!c)throw Error('Défi introuvable.');document.getElementById('challenge-editor')?.remove();const panel=document.createElement('div');panel.id='challenge-editor';panel.className='panel';panel.innerHTML=`<h3>✏️ Modifier le défi</h3><form id="editchallenge"><input type="hidden" name="id" value="${c.id}"><label>Titre</label><input name="title" required maxlength="160"><label>Consigne</label><textarea name="description" required rows="4"></textarea><label>Difficulté / Points</label><select name="points"><option value="100">Facile — 100 points</option><option value="200">Moyen — 200 points</option><option value="300">Difficile — 300 points</option></select><button class="green" type="submit">Enregistrer les modifications</button><button type="button" data-act="cancel-edit">Annuler</button></form>`;document.body.appendChild(panel);panel.querySelector('[data-act="cancel-edit"]').addEventListener('click',()=>panel.remove());panel.querySelector('[name=title]').value=c.title;panel.querySelector('[name=description]').value=c.description;panel.querySelector('[name=points]').value=String(c.points);return}if(b.dataset.act==='cancel-edit'){document.getElementById('challenge-editor')?.remove();return}if(b.dataset.act==='import-40'){if(game.owner!==session.user.id)throw Error('Réservé à l’organisateur.');const n=await importDefaultChallenges40(game.id);await refresh();say(n?n+' défis ajoutés à la partie.':'Les 40 défis sont déjà présents.');return}if(b.dataset.act==='signup'){const f=$('auth');const d=new FormData(f);const {error}=await sb.auth.signUp({email:d.get('email'),password:d.get('password')});if(error)throw error;say('Compte créé. Vérifiez votre e-mail si une confirmation est demandée.');return}if(b.dataset.act==='guest'){const {error}=await sb.auth.signInAnonymously();if(error)throw new Error(error.message+' — Vérifiez Supabase → Authentication → Providers → Anonymous Sign-Ins.');return}if(b.dataset.act==='logout'){await stopWatch();await sb.auth.signOut();game=null;return}if(b.dataset.act==='ceremony-open'){if(game.phase!=='finished')throw Error('Terminez la partie avant de lancer la cérémonie.');ceremonyView=true;render();return}if(b.dataset.act==='ceremony-back'){ceremonyView=false;render();return}if(b.dataset.act==='ceremony-next'){if(game.owner!==session.user.id||game.phase!=='finished')throw Error('Action réservée à l’organisateur.');const next=Math.min(Number(game.ceremony_step||0)+1,teams.length+1);await query(sb.from('pc_games').update({ceremony_step:next}).eq('id',game.id).eq('owner',session.user.id));await refresh();return}if(b.dataset.act==='back'){game=null;await stopWatch();render();return}if(b.dataset.open){await openGame(b.dataset.open);return}if(b.dataset.join){const id=await query(sb.rpc('pc_join',{join_code:b.dataset.code,join_team:b.dataset.join}));await openGame(id);return}if(b.dataset.phase){await query(sb.from('pc_games').update(b.dataset.phase==='finished'?{phase:'finished',ceremony_step:0}:{phase:b.dataset.phase,ceremony_step:0,...(b.dataset.phase==='configuration'||b.dataset.phase==='rush'?{active_awards_challenge:null}:{})}).eq('id',game.id));ceremonyView=false;await refresh();return}if(b.dataset.status){await query(sb.from('pc_submissions').update({status:b.dataset.status}).eq('id',b.dataset.id));await refresh();return}if(b.dataset.media){const s=submissions.find(x=>x.id===b.dataset.media);if(!s)throw Error('Réalisation introuvable');const {data,error}=await sb.storage.from('photo-challenge-media').createSignedUrl(s.object_path,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener');return}}catch(x){err(x)}});
sb.auth.onAuthStateChange((_event,s)=>{session=s; if(!s){game=null;myTeam=null;stopWatch().catch(console.warn)}render();if(s)say('Connexion Supabase active.');else say('Connectez-vous pour commencer.');});const {data:{session:initial}}=await sb.auth.getSession();session=initial;render();say(initial?'Connecté.':'Prêt.');if(pcDisplayId&&initial){openGame(pcDisplayId).catch(err)}

window.addEventListener('popstate',()=>{pcDisplayId=new URLSearchParams(location.search).get('awards-screen');pcDisplaySignature='';if(!pcDisplayId)document.body.classList.remove('pc-awards-mode');render()});
// Confirmation avant chaque bouton, y compris les boutons générés dynamiquement.
// Le clic d'origine est relancé une seule fois après confirmation, sans modifier sa fonction.
const pcConfirmedClicks=new WeakSet();
function pcAskButtonConfirmation(button){
 if(document.getElementById('pc-confirm-layer'))return;
 const label=(button.getAttribute('aria-label')||button.textContent||button.getAttribute('title')||'cette action').replace(/\s+/g,' ').trim();
 const layer=document.createElement('div');layer.id='pc-confirm-layer';
 layer.innerHTML='<div id="pc-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pc-confirm-title"><h2 id="pc-confirm-title">⚠️ CONFIRMATION</h2><p id="pc-confirm-question"></p><div class="pc-confirm-actions"><button type="button" id="pc-confirm-cancel">Annuler</button><button type="button" id="pc-confirm-ok">Confirmer</button></div></div>';
 layer.querySelector('#pc-confirm-question').textContent='Voulez-vous confirmer : « '+label+' » ?';
 document.body.appendChild(layer);
 const cancel=layer.querySelector('#pc-confirm-cancel');const ok=layer.querySelector('#pc-confirm-ok');
 const close=()=>{document.removeEventListener('keydown',onKey);layer.remove()};
 const onKey=e=>{if(e.key==='Escape'){e.preventDefault();close()}};
 document.addEventListener('keydown',onKey);
 cancel.addEventListener('click',close);
 ok.addEventListener('click',()=>{close();if(button.disabled)return;
  // L'écran public est ouvert directement : ne dépend pas du clic synthétique,
  // parfois ignoré sur mobile après une confirmation.
  if(button.dataset.act==='awards-display'){pcOpenDisplay();return}
  if(!button.isConnected)return;pcConfirmedClicks.add(button);button.click()
 });
 cancel.focus();
}
document.addEventListener('click',function pcConfirmCapture(e){
 const button=e.target.closest?.('button');
 if(!button||button.closest('#pc-confirm-layer'))return;
 // Confirmation réservée aux changements de phase, à la cérémonie, à la déconnexion et aux retours.
 const needsConfirmation=button.hasAttribute('data-phase')||['ceremony-open','logout','back','ceremony-back','awards-display-back'].includes(button.dataset.act);
 if(!needsConfirmation)return;
 if(pcConfirmedClicks.has(button)){pcConfirmedClicks.delete(button);return}
 e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
 pcAskButtonConfirmation(button);
},true);
</script></body></html>
