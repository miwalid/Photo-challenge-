<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTO CHALLENGE — Online</title><style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#090d25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 5%,#2a145e,#090d25 65%);min-height:100vh}.shell{max-width:800px;margin:auto;padding:24px 16px 100px}h1{text-align:center;font-size:clamp(35px,9vw,65px);margin:16px 0 0;color:#fff;text-shadow:0 0 22px #12dafa}h1 span{color:#ffd05a}h2{margin:8px 0 20px}p,small{color:#c9d7ff;line-height:1.5}.panel{background:#111d46e8;border:1px solid #36c9f9;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 0 22px #0ab7fa22}label{display:block;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;padding:13px;background:#0a1330;border:1px solid #7289b8;border-radius:11px;color:#fff;font:inherit}input[type=file]{padding:9px}button{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(#ff50c5,#bf087a);color:white;font-weight:800;font-size:16px;cursor:pointer;margin:6px 6px 6px 0}button.blue{background:linear-gradient(#36b5ff,#174ac0)}button.green{background:linear-gradient(#13c7a1,#087d72)}button.orange{background:linear-gradient(#ffbd39,#e06d0a)}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid #526b9c;background:#101632;border-radius:12px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#253f78;padding:4px 9px;border-radius:30px}.hidden{display:none}#notice{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f28;border-radius:10px;padding:12px;margin:12px 0;color:#98f8dc}a{color:#8af4ff}.top{text-align:center}.muted{opacity:.7}code{overflow-wrap:anywhere}</style></head><body><div class="shell"><div class="top"><h1>📸 PHOTO <span>CHALLENGE</span></h1><p>Édition en ligne · Supabase uniquement</p></div><div id="notice">Chargement…</div><div id="root"></div></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const URL='https://sykfpdmhuxbwxohzyiee.supabase.co';
const KEY='sb_publishable_OWtyhUIEfdxWOi-3X-Rozw_XqSV-D5G';
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null,game=null,teams=[],challenges=[],submissions=[],votes=[],myTeam=null,role='player',channel=null;
const say=(s)=>{$('notice').textContent=s};const err=e=>say('Erreur : '+(e?.message||e));const randomCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
async function query(p){const {data,error}=await p;if(error)throw error;return data}
async function refresh(){if(!game)return;game=await query(sb.from('pc_games').select('*').eq('id',game.id).single());teams=await query(sb.from('pc_teams').select('*').eq('game_id',game.id).order('name'));challenges=await query(sb.from('pc_challenges').select('*').eq('game_id',game.id));submissions=await query(sb.from('pc_submissions').select('*').eq('game_id',game.id).order('created_at',{ascending:false}));votes=await query(sb.from('pc_votes').select('*'));myTeam=await query(sb.from('pc_members').select('team_id').eq('game_id',game.id).eq('user_id',session.user.id).maybeSingle());render()}
function watch(){if(channel)sb.removeChannel(channel);channel=sb.channel('pc-'+game.id).on('postgres_changes',{event:'*',schema:'public',table:'pc_games'},()=>refresh().catch(err)).on('postgres_changes',{event:'*',schema:'public',table:'pc_submissions'},()=>refresh().catch(err)).on('postgres_changes',{event:'*',schema:'public',table:'pc_teams'},()=>refresh().catch(err)).on('postgres_changes',{event:'*',schema:'public',table:'pc_challenges'},()=>refresh().catch(err)).subscribe()}
function home(){return `<section class="panel"><h2>Connexion</h2><p>Organisateur : connectez-vous avec votre e-mail. Joueur : entrez en invité.</p><form id="auth"><label>E-mail</label><input name="email" type="email" required><label>Mot de passe</label><input name="password" type="password" minlength="6" required><button class="blue">Se connecter</button><button type="button" data-act="signup">Créer un compte</button></form><button class="green" data-act="guest">Rejoindre comme invité</button><p><small>Les joueurs invités nécessitent l’option Anonymous Sign-Ins activée dans Supabase Auth. Ne communiquez jamais votre mot de passe organisateur.</small></p></section>`}
function lobby(){return `<section class="panel"><h2>Bienvenue</h2><p>Connecté : ${esc(session.user.email||'Invité')} · Auth Supabase</p><button data-act="logout">Déconnexion</button><div class="row"><div><h3>Organiser</h3><form id="newgame"><label>Nom de la partie</label><input name="name" required maxlength="80"><button class="orange">Créer une partie</button></form></div><div><h3>Rejoindre</h3><form id="findgame"><label>Code de la partie</label><input name="code" required maxlength="8" style="text-transform:uppercase"><button class="blue">Voir les équipes</button></form><div id="joinTeams"></div></div></div><h3>Mes parties organisées</h3><div id="mygames">Chargement…</div></section>`}
function gameUI(){const owner=game.owner===session.user.id;const isMember=!!myTeam;const team=teams.find(t=>t.id===myTeam?.team_id);return `<section class="panel"><button class="blue" data-act="back">← Accueil</button><h2>${esc(game.name)}</h2><p>Code à partager : <strong>${esc(game.code)}</strong> · Phase : <span class="pill">${esc(game.phase)}</span></p><p>${owner?'Organisateur':`Joueur · ${esc(team?.name||'Équipe non choisie')}`}</p>${owner?`<div class="row"><button class="green" data-phase="configuration">Configuration</button><button class="green" data-phase="rush">PHOTO RUSH</button><button class="orange" data-phase="awards">PHOTO AWARDS</button><button data-phase="finished">Terminer</button></div><form id="newteam"><label>Ajouter une équipe</label><input name="name" required maxlength="80"><button class="blue">Ajouter</button></form><form id="newchallenge"><label>Nouveau défi</label><input name="title" required maxlength="140"><label>Consigne</label><textarea name="description"></textarea><label>Points</label><select name="points"><option>100</option><option>200</option><option>300</option></select><button class="blue">Ajouter le défi</button></form>`:''}<h3>Équipes (${teams.length})</h3>${teams.map(t=>`<div class="item">${esc(t.name)}</div>`).join('')||'<p>Aucune équipe.</p>'}<h3>Défis (${challenges.length})</h3>${challenges.map(c=>`<div class="item"><b>${esc(c.title)}</b> · ${c.points} pts<p>${esc(c.description)}</p>${isMember&&game.phase==='rush'?`<form class="upload" data-challenge="${c.id}"><label>Photo ou vidéo (max. 50 Mo)</label><input type="file" name="media" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" required><button class="green">Envoyer pour validation</button></form>`:''}</div>`).join('')||'<p>Aucun défi.</p>'}<h3>Réalisations</h3>${submissions.map(s=>{const t=teams.find(x=>x.id===s.team_id),c=challenges.find(x=>x.id===s.challenge_id);const voted=votes.some(v=>v.submission_id===s.id&&v.user_id===session.user.id);return `<div class="item"><b>${esc(t?.name)} — ${esc(c?.title)}</b><p>Statut : ${esc(s.status)}</p>${owner?`<button class="green" data-status="accepted" data-id="${s.id}">Accepter</button><button data-status="rejected" data-id="${s.id}">Refuser</button>`:''}<button class="blue" data-media="${s.id}">Voir le média</button>${isMember&&game.phase==='awards'&&s.status==='accepted'&&s.team_id!==myTeam.team_id&&!voted?`<form class="vote" data-id="${s.id}"><label>Créativité</label><select name="creativity">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label>Humour</label><select name="humor">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><label>Respect du défi</label><select name="respect">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><button>Voter</button></form>`:voted?'<p>Vote enregistré</p>':''}</div>`}).join('')||'<p>Aucune réalisation.</p>'}</section>`}
function render(){$('root').innerHTML=!session?home():!game?lobby():gameUI();if(session&&!game)loadMyGames().catch(err)}
async function loadMyGames(){const list=await query(sb.from('pc_games').select('id,name,code').eq('owner',session.user.id).order('created_at',{ascending:false}));if($('mygames'))$('mygames').innerHTML=list.map(g=>`<div class="item"><b>${esc(g.name)}</b> · ${esc(g.code)} <button class="blue" data-open="${g.id}">Ouvrir</button></div>`).join('')||'<p>Aucune partie.</p>'}
async function openGame(id){game=await query(sb.from('pc_games').select('*').eq('id',id).single());await refresh();watch();say('Partie synchronisée.')} 
$('root').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=new FormData(f);try{if(f.id==='auth'){await query(sb.auth.signInWithPassword({email:d.get('email'),password:d.get('password')}));return}if(f.id==='newgame'){let g;for(let i=0;i<4;i++){try{g=await query(sb.from('pc_games').insert({name:d.get('name'),code:randomCode(),owner:session.user.id}).select().single());break}catch(x){if(x.code!=='23505')throw x}}if(!g)throw Error('Impossible de générer le code');await openGame(g.id);return}if(f.id==='findgame'){const code=String(d.get('code')).toUpperCase().trim();const list=await query(sb.rpc('pc_teams_for_code',{join_code:code}));$('joinTeams').innerHTML=list.length?`<p>Choisissez votre équipe :</p>${list.map(t=>`<button class="blue" data-join="${t.id}" data-code="${esc(code)}">${esc(t.name)}</button>`).join('')}`:'Aucune équipe trouvée.';return}if(f.id==='newteam'){await query(sb.from('pc_teams').insert({game_id:game.id,name:d.get('name')}));await refresh();return}if(f.id==='newchallenge'){await query(sb.from('pc_challenges').insert({game_id:game.id,title:d.get('title'),description:d.get('description'),points:Number(d.get('points'))}));await refresh();return}if(f.classList.contains('upload')){if(!myTeam?.team_id)throw Error('Vous devez rejoindre une équipe.');const file=d.get('media');if(!file||!file.size||file.size>50*1024*1024)throw Error('Fichier vide ou trop volumineux (50 Mo max).');if(!['image/jpeg','image/png','image/webp','video/mp4','video/webm'].includes(file.type))throw Error('Format non autorisé.');const path=`${game.id}/${myTeam.team_id}/${session.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error:uploadError}=await sb.storage.from('photo-challenge-media').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;try{await query(sb.from('pc_submissions').insert({game_id:game.id,challenge_id:f.dataset.challenge,team_id:myTeam.team_id,user_id:session.user.id,object_path:path,media_type:file.type}))}catch(x){await sb.storage.from('photo-challenge-media').remove([path]);throw x}say('Média envoyé pour validation.');await refresh();return}if(f.classList.contains('vote')){await query(sb.from('pc_votes').insert({submission_id:f.dataset.id,user_id:session.user.id,creativity:Number(d.get('creativity')),humor:Number(d.get('humor')),respect:Number(d.get('respect'))}));say('Vote enregistré.');await refresh();return}}catch(x){err(x)}});
$('root').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.act==='signup'){const f=$('auth');const d=new FormData(f);const {error}=await sb.auth.signUp({email:d.get('email'),password:d.get('password')});if(error)throw error;say('Compte créé. Vérifiez votre e-mail si une confirmation est demandée.');return}if(b.dataset.act==='guest'){const {error}=await sb.auth.signInAnonymously();if(error)throw new Error(error.message+' — Vérifiez Supabase → Authentication → Providers → Anonymous Sign-Ins.');return}if(b.dataset.act==='logout'){await sb.auth.signOut();game=null;return}if(b.dataset.act==='back'){game=null;if(channel)await sb.removeChannel(channel);render();return}if(b.dataset.open){await openGame(b.dataset.open);return}if(b.dataset.join){const id=await query(sb.rpc('pc_join',{join_code:b.dataset.code,join_team:b.dataset.join}));await openGame(id);return}if(b.dataset.phase){await query(sb.from('pc_games').update({phase:b.dataset.phase}).eq('id',game.id));await refresh();return}if(b.dataset.status){await query(sb.from('pc_submissions').update({status:b.dataset.status}).eq('id',b.dataset.id));await refresh();return}if(b.dataset.media){const s=submissions.find(x=>x.id===b.dataset.media);if(!s)throw Error('Réalisation introuvable');const {data,error}=await sb.storage.from('photo-challenge-media').createSignedUrl(s.object_path,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener');return}}catch(x){err(x)}});
sb.auth.onAuthStateChange((_event,s)=>{session=s; if(!s){game=null;myTeam=null}render();if(s)say('Connexion Supabase active.');else say('Connectez-vous pour commencer.');});const {data:{session:initial}}=await sb.auth.getSession();session=initial;render();say(initial?'Connecté.':'Prêt.');
</script></body></html>
